services:
  db:
    image: postgres:16-alpine
    container_name: dealerhub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dealerhub
      POSTGRES_PASSWORD: dealerhub
      POSTGRES_DB: dealerhub
    ports:
      - '5432:5432'
    volumes:
      - dealerhub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dealerhub -d dealerhub']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dealerhub-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: postgresql://dealerhub:dealerhub@db:5432/dealerhub?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-access-secret-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret-in-production}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 100
      LOG_LEVEL: info
    ports:
      - '3333:3333'
    command: sh -c "npx prisma migrate deploy && node dist/server.js"

volumes:
  dealerhub_pgdata:
